<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список телефонов</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        h1 { color: #333; }
        table { border-collapse: collapse; width: 100%; max-width: 700px; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 10px 15px; text-align: left; }
        th { background: #333; color: #fff; }
        tr:nth-child(even) { background: #f9f9f9; }
        tr:hover { background: #eef; }
        .price { text-align: right; }
    </style>
</head>
<body>
    <nav>
        <a href="/about">ABOUT</a>
        <a href="/contacts">CONTACTS</a>
    </nav>
    <h1>Список телефонов</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Производитель</th>
                <th>Модель</th>
                <th>Цена</th>
            </tr>
        </thead>
        <tbody>
            {{range .}}
            <tr>
                <td>{{.Id}}</td>
                <td>{{.Vendor}}</td>
                <td>{{.Model}}</td>
                <td class="price">{{.Price}} ₽</td>
            </tr>
            {{end}}
        </tbody>
    </table>
</body>
</html>
